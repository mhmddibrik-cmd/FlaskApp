name: CI Pipeline

# QUESTION: trigger on push AND on Pull Request
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # JOB 1: run the tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  # JOB 2: build Docker image (runs AT THE SAME TIME as "test")
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flaskapp .

  # JOB 3: push the image to 2 registries, ONLY if tests passed
  push:
    needs: [test, build]
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to both registries
        run: |
          docker build -t flaskapp .
          docker tag flaskapp ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest
          docker tag flaskapp ghcr.io/mhmddibrik-cmd/flaskapp:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest
          docker push ghcr.io/mhmddibrik-cmd/flaskapp:latest

  # JOB 4: send an email ONLY if the tests fail
  notify:
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Tests FAILED in FlaskApp"
          to: mhmddibrik@gmail.com
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: "The tests failed. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"